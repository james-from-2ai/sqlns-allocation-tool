name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site is static, but the parity test is what makes it trustworthy, so it
  # gates the deploy.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Reads the committed fixtures, not the 58 MB source export, so it runs
      # without the workbook being present.
      - name: Parity test against the workbook's cached values
        run: node tools/parity_test.mjs
      # Covers state-scoped allocation, which the parity test cannot reach
      # because the source sheet has no scoped mode.
      - name: Scope test for state-scoped allocation
        run: node tools/scope_test.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
